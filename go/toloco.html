<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirecting to Official Verified Offer...</title>
  <style>
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 { font-size: 22px; margin-bottom: 8px; font-weight: 800; }
    p { font-size: 14px; color: #94a3b8; }
    a { color: #f59e0b; font-weight: bold; text-decoration: underline; }
  </style>
  <script>
    (function() {
      // Direct Offer Destination for TOLOCO Massage Gun
      var targetUrl = "https://www.amazon.com/dp/B089KJTW4V?tag=prismeia-tw-20";
      
      // Preserve tracking query parameters if any (k4m, source, zone_id, etc.)
      var search = window.location.search;
      if (search) {
        var sep = targetUrl.indexOf('?') === -1 ? '?' : '&';
        targetUrl += sep + search.substring(1);
      }

      // Fast instant redirection
      setTimeout(function() {
        window.location.replace(targetUrl);
      }, 350);
    })();
  </script>
</head>
<body>
  <div>
    <div class="spinner"></div>

</body>
</html>
